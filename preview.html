<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寓见 · 原型预览入口</title>
<style>
:root{
  --grad:linear-gradient(135deg,#8b5cf6 0%,#6366f1 45%,#22d3ee 100%);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#070b15;color:#eef1f8;padding:24px;position:relative;overflow-x:hidden;
}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none}
body::before{width:600px;height:600px;background:rgba(139,92,246,.18);top:-200px;left:12%}
body::after{width:500px;height:500px;background:rgba(34,211,238,.12);bottom:-180px;right:8%}
.wrap{position:relative;z-index:1;text-align:center;max-width:860px;width:100%}
.logo{
  width:64px;height:64px;border-radius:20px;background:var(--grad);margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 14px 36px rgba(124,92,252,.5);
}
.logo svg{width:32px;height:32px;color:#fff}
h1{font-size:32px;font-weight:800;letter-spacing:1px}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#8b93a7;font-size:13px;margin:8px 0 36px;letter-spacing:1px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{
  display:block;text-decoration:none;color:inherit;text-align:left;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
  border-radius:22px;padding:28px;transition:.25s;position:relative;overflow:hidden;
}
.card:hover{transform:translateY(-5px);border-color:rgba(139,92,246,.5);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.card::after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;filter:blur(50px);right:-36px;top:-44px;opacity:.5}
.card.c1::after{background:rgba(139,92,246,.5)}
.card.c2::after{background:rgba(34,211,238,.4)}
.card .tag{font-size:10.5px;font-weight:800;letter-spacing:2px;color:#22d3ee;margin-bottom:10px}
.card h2{font-size:19px;font-weight:800;margin-bottom:8px}
.card p{font-size:12.5px;color:#8b93a7;line-height:1.8}
.card .go{
  display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:13px;font-weight:700;
  background:var(--grad);color:#fff;padding:9px 20px;border-radius:12px;
  box-shadow:0 8px 20px rgba(124,92,252,.4);
}
.card .go svg{width:14px;height:14px}
.foot{margin-top:34px;font-size:11px;color:#5c6478}
@media (max-width:640px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M9 13h1M14 9h1M14 13h1M10 21v-4h4v4"/></svg>
  </div>
  <h1>寓<em>见</em> · 智慧公寓原型</h1>
  <div class="sub">基于《公寓出租管理系统需求文档》· 前端可运行原型 · 请选择要预览的端</div>
  <div class="cards">
    <a class="card c1" href="./index.html">
      <div class="tag">WEB ADMIN</div>
      <h2>房东管理后台</h2>
      <p>数据看板 · 房源/房间管理 · 租客/租约 · 账单财务 · IoT 设备 · 报修工单 · 系统设置，共 10 大模块。</p>
      <span class="go">进入后台原型 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></span>
    </a>
    <a class="card c2" href="./mp-prototype.html">
      <div class="tag">WECHAT MINI PROGRAM</div>
      <h2>租客端微信小程序</h2>
      <p>手机壳模拟真实小程序环境：看房 · 在线签约 · 账单缴费 · 自助报修 · 智能门锁临时密码全流程。</p>
      <span class="go">进入小程序原型 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></span>
    </a>
  </div>
  <div class="foot">寓见 YUJIAN · 原型演示 · 2026</div>
</div>
</body>
</html>
